# Niveaux de log : voir logback.xml (racine INFO, fr.roboteek INFO).
spring.output.ansi.enabled=always

# IA conversationnelle : Claude via l'API Anthropic (clé dans le .env, jamais versionnée).
# Valeur par défaut vide pour ne pas empêcher le démarrage du robot si la clé est absente.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
