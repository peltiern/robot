# Devices to select (by their name or partial name)
device.webcam.name=Integrated_Webcam_HD
device.microphone.name=ArrayUAC10

# Vision (webcam + detection). Necessite une webcam et le serveur Python gRPC
# (localhost:50051). Sans rebuild : editer ici puis redemarrer le conteneur (le flag est
# lu au demarrage de l'organe). Activee : c'est l'etat du robot, releve le 2026-09-08.
robot.capteurs.vision.enabled=true

# Debit du flux video envoye a la webapp. C'est le debit de PRODUCTION qui doit tenir dans
# le lien : rien, en aval, ne freine la boucle de capture. Trop haut, les images s'empilent
# dans le tampon d'envoi de la session jusqu'a la limite et Spring ferme la connexion
# ("Buffer size ... exceeds the allowed limit"), d'ou une webapp qui laggue puis se coupe.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# Reperes en 640x480 : qualite 60 + 8 fps ~= 120 Ko/s ; qualite 95 + 10 fps ~= 1 Mo/s.
# La qualite s'applique aussi a l'image envoyee au serveur Python de detection.
robot.capteurs.vision.stream.fps=8
robot.capteurs.vision.stream.jpeg.quality=60

# Ce qu'un visage doit valoir pour qu'on en tire une empreinte -- meme porte pour la photo
# importee et pour la camera. Une empreinte baclee ne gene pas que la personne concernee : la
# reconnaissance retient la MEILLEURE similarite parmi toutes les empreintes connues, et une
# mauvaise empreinte peut depasser le seuil face a quelqu'un d'AUTRE.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# - nettete.minimale : variance du laplacien, visage ramene a 192 px. Reperes mesures sur les
#   photos d'exemple : nettes 222 a 3423, franchement floutees 3 a 52. Si un enrolement devant
#   la camera echoue toujours ("Je n'ai pas reussi a bien te regarder"), c'est le premier
#   nombre a baisser -- les logs DEBUG de l'organe vision donnent la valeur mesuree.
# - asymetrie.maximale : decalage du nez par rapport au milieu des yeux, en ecarts d'yeux.
#   Au-dela, le visage est tenu pour trop de profil : SFace est entraine de face, et l'empreinte
#   d'un profil tombe parfois plus pres de quelqu'un d'autre. Le robot rend alors "quelqu'un"
#   au lieu d'un nom -- ca ne le fait PAS mieux reconnaitre de profil, ca remplace une mauvaise
#   reponse par pas de reponse. Reperes : de face 0,01 a 0,10 (roulis compris) ; 0,35 vaut a
#   peu pres 45 degres de lacet. Le baisser rend le robot muet des qu'on ne le regarde pas.
robot.capteurs.vision.visage.nettete.minimale=100
robot.capteurs.vision.visage.asymetrie.maximale=0.35

# Presence des personnes : a partir de quand le robot considere que quelqu'un est la, qu'il
# est parti, et qu'une rencontre merite d'etre annoncee.
# La detection de visages CLIGNOTE : mesure sur le robot, un visage immobile disparait et
# reapparait par trous de 100 a 250 ms, une seule frame ratee par le detecteur suffisant.
# Sans ces garde-fous, le robot demanderait son prenom a la meme personne six fois par quart
# de minute, et finirait debranche.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# - confirmation : duree de presence continue avant de croire que quelqu'un est la. Plus bas,
#   le robot aborde plus vite, mais reagit a qui ne fait que passer devant la camera.
#   C'est aussi le delai laisse a SFace pour reconnaitre quelqu'un avant qu'il soit declare
#   inconnu -- et SFace met couramment 1 s, bien plus de profil ou en bord de champ. Monter ce
#   seuil pour couvrir ces cas avait ete essaye le 2026-08-15 a 4.0 et juge mauvais : ca ralentit
#   l'abord d'un vrai inconnu sans jamais rendre la certitude. C'est PresentationActivity qui
#   traite l'erreur, en s'excusant si la personne est reconnue pendant qu'on lui demande son
#   prenom.
#   ATTENTION, CONTRADICTION NON TRANCHEE : le robot tourne a 4.0, releve sur le Jetson le
#   2026-09-08, contre l'avis ci-dessus. Soit la conclusion d'aout est perimee, soit c'est un
#   reste d'essai jamais remis a 1.5. A juger a l'usage, pas au raisonnement.
# - absence : duree sans voir quelqu'un avant de le croire parti. C'est ce delai qui absorbe
#   le clignotement ; le descendre sous 1 s reveille le probleme.
# - fenetre : duree glissante sur laquelle un inconnu et les personnes connues sont departages
#   au nombre de fois qu'ils ont ete vus. Un meme visage sort tantot reconnu, tantot inconnu :
#   vu 3 fois comme Nicolas et 2 fois comme un inconnu, c'est Nicolas, et rien n'est demande.
#   L'arbitrage ne joue que dans ce sens : une erreur d'inconnu coute une question a quelqu'un
#   qu'on connait, une erreur de connu ne coute rien.
# - continuite : trou maximal tolere TANT QUE la venue n'est pas confirmee. Au dela, le
#   decompte repart de zero. C'est ce qui garantit plusieurs visages vus A LA SUITE avant de
#   decider, inconnu comme connu : sans lui, la tolerance de 4 s ci-dessus s'appliquait aussi
#   a la confirmation, et des perceptions eparses cumulaient la duree exigee comme si elles
#   avaient ete continues.
# - temporisation : delai minimal entre deux rencontres annoncees pour la MEME personne, meme
#   si elle est vraiment sortie du champ et revenue. Descendu de 120 a 30 s le 2026-08-15 :
#   a 120 s, quelqu'un qui s'absentait une minute revenait sans que le robot ne dise rien.
#   C'est desormais sans danger, une absence courte donnant une reprise et non un bonjour
#   (voir robot.retrouvailles.reprise.seconds plus bas). Ne pas trop descendre non plus :
#   quelqu'un qui bouge devant la camera se ferait relancer sans arret.
robot.presence.confirmation.seconds=4.0
robot.presence.absence.seconds=4.0
robot.presence.continuite.seconds=1.0
robot.presence.fenetre.seconds=3.0
robot.presence.rencontre.temporisation.seconds=30.0

# Retrouvailles : ce que le robot dit a quelqu'un de connu qui reapparait devant lui.
# TROIS reactions selon la duree de l'ABSENCE REELLE (le temps pendant lequel la personne n'a
# pas ete vue, et non le temps ecoule depuis la derniere rencontre annoncee -- avoir confondu
# les deux a fait dire au robot << on parlait de la population francaise >> douze secondes
# apres en avoir parle) :
# - sous silence.seconds : il ne dit RIEN. La personne s'est tournee ou est sortie du champ un
#   instant, la conversation n'a jamais ete interrompue, et la reprendre reviendrait a la couper.
# - sous reprise.seconds : il REPREND le fil sans saluer. Quelqu'un qui s'est absente une minute
#   et se fait dire bonjour a l'impression d'avoir ete oublie.
# - au dela : il SALUE, l'absence se remarque.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
robot.retrouvailles.silence.seconds=60.0
robot.retrouvailles.reprise.seconds=300.0

# Activites : delai minimal avant qu'une activite qui vient de se terminer puisse etre
# reclamee a nouveau. A ne pas confondre avec la temporisation ci-dessus, qui compte par
# personne : celle-ci protege de toute demande insistante, d'ou qu'elle vienne.
# Le cas traite est celui d'une activite qui tourne court (quelqu'un qu'on aborde et qui ne
# repond pas) : la cause est toujours la quand elle se termine, et sans delai elle repartirait
# aussitot, en boucle.
# Depuis le 2026-08-15, une demande refusee n'est plus perdue : elle est rejouee des que ce
# delai est ecoule, tant que la personne est la. Il n'a donc plus a etre court par prudence,
# mais 10 s suffisent -- 30 s se voyaient a l'usage, le robot restant muet devant quelqu'un.
# RECHARGE A CHAUD : editer cette valeur suffit, sans rebuild NI redemarrage du conteneur.
robot.activite.temporisation.seconds=10.0

# Regard : le robot tourne la tete vers le visage qu'il percoit (panoramique et inclinaison,
# en boucle ouverte, un coup a la fois). La camera etant portee par la tete, le visage se
# retrouve recentre et la correction suivante n'a plus lieu d'etre.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# - sens.inverse : ETALONNAGE A FAIRE UNE FOIS PAR AXE. Le sens depend du montage du servo,
#   indevinable depuis le code, et les deux axes sont independants. Si le robot DETOURNE la
#   tete au lieu de regarder, passer l'axe concerne a true.
#   Le panoramique a ete verifie sur le robot le 2026-08-12 : false est le bon sens.
# - camera.champ.horizontal.degres : champ de vision de la webcam. Une valeur fausse ne fait
#   pas regarder a cote, elle fait sous-corriger ou depasser. A mesurer plutot qu'a croire.
#   Sert aux DEUX axes : les pixels etant carres, l'echelle est la meme en hauteur -- ce que
#   l'etalonnage confirme (fx et fy a 0,13 % l'un de l'autre).
#   MESURE AU DAMIER, et la question est close. La valeur precedente, 60,0, venait d'une fiche
#   produit et etait fausse de 20,6 % -- dans le sens qui SOUS-estimait tous les ecarts.
#   Quatre seances, DEUX IMPLEMENTATIONS INDEPENDANTES, focale en pixels :
#     460,73 et 457,96  util.webcam.EtalonnageCamera (OpenCV), sur le Jetson, 2026-09-05
#     462,30            le meme, sur des images prises le 2026-09-06 en voyant l'ecran
#     462,50            BoofCV, sur CES MEMES images -- 0,04 % d'ecart avec le precedent, et
#                       des coefficients de distorsion identiques a la 4e decimale
#   Retenu : 462,50 px, soit 69,36 degres. Les deux premieres seances, prises a l'aveugle sur
#   le robot, avaient une erreur de reprojection 3 a 5 fois plus grande : elles ne pesent pas.
#   L'OBJECTIF EST UN FISHEYE et le 640x480 en est un RECADRAGE CENTRAL, pas une reduction --
#   verifie image a l'appui le 2026-09-06, le 1280x720 montre le disque et ses coins noirs.
#   D'ou l'inutilite d'etalonner dans une autre resolution : ce serait un autre objectif.
#   Deux resultats de la meme mesure ne sont PAS pris en compte ici :
#     . distorsion k1 = -0,39 : un visage vu au coin de l'image est place 20 % trop pres du
#       centre par le modele stenope de Regard (7 % a mi-champ). La boucle converge quand
#       meme, elle y met plus de coups -- c'est le "suite de petits a-coups" observe.
#     . la distorsion reste ignoree, voir ci-dessus.
#   Le POINT PRINCIPAL, lui, n'est plus ignore : voir camera.centre.x/y.relatif juste apres.
# - camera.centre.x/y.relatif : ou tombe l'AXE OPTIQUE dans l'image, en fraction de sa largeur
#   et de sa hauteur. Ce n'est pas le milieu, et le supposer coute un biais PERMANENT : le
#   capteur n'est pas centre derriere l'objectif. Cinq calculs independants, deux implementations
#   (OpenCV et BoofCV), placent le point principal a (331,5 ; 206,1) sur du 640x480 -- 34 pixels
#   au-dessus du milieu, soit 4,2 degres. Le robot cadrait donc les visages un peu bas et
#   regardait au-dessus des tetes ; surtout, ce biais poussait l'INCLINAISON DANS SA BUTEE HAUTE
#   en permanence (quatre entrees en butee en deux minutes le 2026-09-06) et lui volait 4,2
#   degres de course. En fraction et non en pixels : Regard ne suppose nulle part une resolution.
#   Defaut 0.5 : le milieu, c'est-a-dire le comportement d'un robot dont la camera n'a pas ete
#   etalonnee.
# - camera.deport.degres : de combien le PANORAMIQUE vise a cote de l'axe optique. La webcam
#   n'est que dans un des deux yeux, deportee d'environ 66 mm du plan de symetrie de la tete
#   (releve sur le STL) : centrer le visage sur l'image revient a l'aligner sur cet oeil-la, la
#   tete reste tournee de quelques degres et le robot fixe d'un oeil au lieu de faire face.
#   C'est de la PARALLAXE, atan(66 mm / distance) -- 7,5 degres a 0,5 m, 3,8 a 1 m, 1,9 a 2 m.
#   UNE CONSTANTE SUFFIT, et ce n'est pas un pis-aller : avec la valeur juste a un metre, le
#   residu ne depasse pas 3,7 degres entre 0,5 m et 3 m, il reste donc SOUS LA ZONE MORTE et le
#   robot ne le corrigerait pas meme s'il le connaissait. Estimer la distance par la taille du
#   visage aurait suppose une largeur de visage, qui varie de 15 % d'une personne a l'autre :
#   du code pour un raffinement inferieur a son propre bruit. Ca ne decroche qu'en deca de
#   0,5 m, ou l'on ne converse plus.
#   LE SIGNE A ETE TROUVE A L'ESSAI le 2026-09-07 (+3.8 est le bon) : il depend de l'oeil qui
#   porte la camera et d'un eventuel retournement du flux, deux choses qu'aucun raisonnement ne
#   tranchait a coup sur. L'inclinaison n'est pas concernee, les deux yeux sont a la meme hauteur.
# - zone.morte : en deca, le robot considere qu'il regarde deja la personne. Sans elle, la
#   boite englobante qui respire d'une image a l'autre suffirait a agiter la tete.
#   C'est aussi elle qui absorbe ce qui reste d'imprecision apres le mouvement.
#   Attention en la baissant : la consigne correspondante doit rester au-dessus de 1 unite,
#   sinon l'axe ne corrige plus rien (le code refuse ces consignes-la, sans quoi il les
#   repeterait sans fin).
#   ELLE EST SOLIDAIRE DU CHAMP, et c'est ce qu'on a oublie le 2026-09-05. Les deux gains
#   avaient ete divises pour compenser la correction du champ ; elle, exprimee dans les memes
#   degres, ne l'avait pas ete. Ses 5,0 valaient 6,0 degres REELS avec l'ancienne focale
#   fausse : le robot s'est donc mis a corriger des ecarts qu'il ignorait la veille, et ca s'est
#   vu tout de suite a l'usage. Passee a 6.0 pour retrouver le comportement d'avant.
#   PASSEE A 4.0 le 2026-09-07, une fois la zone morte DESSINEE SUR LE HUD (carre en pointilles
#   sur la page Pilotage). Jusque-la on la reglait a l'impression : une tete qui s'arrete a cote
#   ne se distingue pas d'une tete qui a decide d'avoir fini. Ne pas descendre plus bas en
#   esperant gagner en precision -- le plancher n'est pas ce reglage mais le TEMPS MORT de la
#   chaine, voir temporisation plus bas : sous 4 degres la tete se met a chasser sans viser
#   plus juste.
# - commande.par.degre.vu : GAIN DE BOUCLE, et SEUL reglage entre l'ecart vu et la consigne.
#   Combien de degres de TETE valent un degre d'ecart vu par la camera. Depuis le 2026-09-08 le
#   cou se commande en degres reels, donc ce nombre ne porte plus le rapport de transmission :
#   il vaut 0.9 sur les deux axes, et 0.9 veut dire ce qu'il dit -- corriger 90 % de l'ecart vu.
#   Auparavant il valait 0.575 et 0.181, soit 0.9 divise par le rapport de chaque axe, et une
#   valeur par axe etait donc necessaire. Ce n'est plus le cas.
#   Le cou se commande en ABSOLU (il lit ou il est et ajoute l'angle) : la cible est donc
#   calculee directement, l'ecart est corrige EN ENTIER, et il n'y a pas d'amortissement.
#   Un amortissement a 70 %, essaye le 2026-08-12, n'a fait qu'etaler le meme mouvement en
#   quatre petits a-coups.
#   Mieux vaut sous-corriger (un mouvement de plus) que sur-corriger (oscillation sans fin).
#   MESURE DIRECTE le 2026-09-06 par EtalonnageCamera --axes, et c'est la SEULE fiable : decor
#   fixe, course commandee connue, image redressee avec l'etalonnage de la camera, deplacement
#   lu par correlation de phase. Ni cible mouvante, ni lecture en retard, ni fiche produit.
#     panoramique  1.56 degres/unite   (deux seances : 1.573 et 1.557 ; fiche goBILDA 1.583)
#     inclinaison  4.97               (fiche Stingray-2 : 4.75)
#     monter/descendre : NE FAIT PAS PIVOTER LA CAMERA. Mesure deux fois, deplacement nul avec
#       une confiance de 0.97 : c'est un axe de TRANSLATION. Regard n'a rien a en tirer.
#   LES FICHES AVAIENT RAISON, a 1 et 3 % pres. Les valeurs precedentes venaient d'une mesure du
#   2026-08-15 faite sur un visage qui bougeait, avec des lectures en retard sur les corrections
#   (une ligne de log de Regard rapporte l'ecart d'AVANT que la correction ait atterri). Elle
#   annoncait 2.1 et 6.9 degres/unite ; tout ce qu'on en avait deduit est a jeter.
#   DU JEU, chiffre pour la premiere fois : les courses positives rendent systematiquement moins
#   que les negatives, et l'ecart se resserre quand la course grandit -- perte fixe au changement
#   de sens. ~0.1 unite au panoramique, ~0.5 a l'inclinaison (train d'engrenages + poids de la
#   tete). La moyenne des deux sens est stable, c'est elle qu'on retient.
#   Les valeurs ci-dessous visent un gain de 0.9 : convergence en un coup, sans depassement.
#   CES DEUX VALEURS ET LE CHAMP NE SE TOUCHENT PAS SEPAREMENT. Elles ont ete reglees a la
#   main AVEC un champ faux : elles en portaient l'erreur. Corriger le champ seul aurait fait
#   passer le gain de 0.9 a 1.09 -- au-dessus de 1, la tete oscille sans fin. Les deux ont donc
#   ete divisees par 1,206 le 2026-09-05 en meme temps que le champ etait corrige : 0.45 ->
#   0.373 et 0.13 -> 0.108, puis reprises de 0,63 % le 2026-09-06 quand le champ est passe de
#   69.7 a 69.36. Ces reprises-la laissaient le comportement inchange.
#   PUIS RECALCULEES SUR LA MESURE DIRECTE, et cette fois le comportement CHANGE : les valeurs
#   precedentes donnaient des gains de boucle reels de 0.58 et 0.54, pas 0.9. Le robot corrigeait
#   un peu plus de la moitie de l'ecart et lui fallait deux ou trois mouvements au lieu d'un --
#   ce sont les a-coups observes a l'usage, et ils ne venaient ni de la camera ni de la zone
#   morte. 0.9 / 1.56 = 0.575 au panoramique, 0.9 / 4.97 = 0.181 a l'inclinaison.
#   Effet de bord heureux : le code refuse les consignes sous 1 unite, et l'inclinaison ne
#   corrigeait donc RIEN en dessous de 9.2 degres d'ecart, bien au-dela de sa zone morte de 6.
#   Avec 0.181 il lui faut 5.5 degres, et le defaut disparait de lui-meme.
#   ET LA ZONE MORTE NE SE COMPENSE PAS, elle. Oubli du 2026-09-05 : elle est exprimee dans les
#   memes degres, et corriger le champ sans y toucher l'a resserree de 6,0 a 5,0 degres reels.
#   Le robot s'est mis a corriger des ecarts qu'il ignorait, d'ou des a-coups. Remise a 6.0.
#   DEFAUT CONNU, rendu visible par la : le code refuse les consignes sous 1 unite. A 0.108
#   unite par degre, l'inclinaison ne corrige qu'a partir de 9,3 degres d'ecart, et non des 5
#   de la zone morte (c'etait deja 7,7 avec 0.13). Ca ne se traite pas au reglage : il faut le
#   vrai rapport de l'axe, encore inconnu -- mesure et fiche goBILDA divergent d'un facteur
#   6,4 sur le quotient inclinaison/panoramique, quotient qui ne depend pourtant pas de la
#   camera.
#   ATTENTION, l'amplitude de cette oscillation est fixee par la zone morte, pas par elle :
#   avec un gain de 2, elargir la zone morte AGRANDIT les mouvements au lieu de les calmer.
#   Trop haut : la tete depasse et l'ecart change de signe a chaque coup. Trop bas : elle
#   arrive par une suite de petits a-coups.
# - temporisation : delai entre deux corrections. Il doit couvrir TOUT le temps mort de la
#   boucle, pas seulement le trajet du servo : l'age de l'image quand Regard la lit, PLUS le
#   temps que met la tete a arriver. Trop court, la correction suivante part d'une image prise
#   avant l'arrivee de la precedente : le meme ecart est corrige deux fois, la tete depasse du
#   double et l'ecart change de signe a chaque coup. C'est le "il fuit mon regard" du
#   2026-09-08, et c'est ce que faisait 0.5.
#   MESURE le 2026-09-11 : la boucle de vision tourne a 25 tours/s au rythme de la camera, les
#   visages sont cherches une image sur trois en 75 a 130 ms -- l'image a 100 a 250 ms quand
#   Regard decide. Le trajet suit les vitesses, qui sont en degres de TETE : 17 degres de tilt
#   a 50 degres/s, 16 de pan a 63 degres/s et 317 degres/s2, c'est 0,4 a 0,45 s. Soit 0,55 a
#   0,7 s pour une correction courante, davantage pour une grande : 0.5 etait SOUS le temps
#   mort. A 1.0, la tete se pose en un ou deux coups et ne bouge plus tant qu'on ne bouge pas.
#   Ne pas redescendre sans avoir raccourci la chaine : le prix est une oscillation, pas un peu
#   de retard. La mesure de la boucle de vision est en DEBUG dans CapteurVisionWebSocketGrpc.
#   Ce que montre un journal quand la valeur est trop courte, et qu'il ne faut pas prendre pour
#   une erreur d'echelle : une correction sur deux sans effet visible, la suivante qui rend le
#   double. La moyenne fait 100 %.
#   Trop long, il ne stabilise rien de plus : il hache le suivi d'un visage qui se deplace.
# - priorite.manette : celui qui conduit gagne. Tout ordre de cou venu de la manette fait taire
#   le suivi de visage pendant ce delai, compte a partir du DERNIER ordre -- donc a partir du
#   relachement du joystick, qui envoie un STOPPER. Le suivi reprend seul, il n'y a pas
#   d'interrupteur a rallumer. Sans ca les deux se disputaient le meme servo : le regard corrige
#   deux fois par seconde, la manette envoie des ordres continus, et rien ne disait qui gagne.
#   Trop court, le regard reprend la tete entre deux coups de joystick ; trop long, le robot
#   parait absent apres qu'on a lache la manette.
robot.regard.enabled=true
robot.regard.panoramique.sens.inverse=false
robot.regard.inclinaison.sens.inverse=false
robot.regard.camera.champ.horizontal.degres=69.36
robot.regard.camera.centre.x.relatif=0.518014
robot.regard.camera.centre.y.relatif=0.429453
robot.regard.camera.deport.degres=3.8
robot.regard.zone.morte.degres=4.0
robot.regard.panoramique.commande.par.degre.vu=0.9
robot.regard.inclinaison.commande.par.degre.vu=0.9
robot.regard.temporisation.seconds=1.0
robot.regard.priorite.manette.seconds=3.0

# Watchdog : coupe les moteurs (arret d'urgence) quand un organe du mouvement cesse de
# donner signe de vie ALORS QUE quelque chose bouge. Le cas a craindre : le robot roule et la
# manette meurt — les ordres de mouvement sont continus, plus personne n'enverra le STOPPER,
# et le bouton B est mort avec elle.
# Le delai est volontairement large devant les cadences reelles de battement (16 ms manette,
# 50 ms cou/yeux, 200 ms chenilles) : une pointe de charge sur le Nano ne doit jamais passer
# pour une panne, un watchdog qui se declenche a tort finit debranche.
# RECHARGE A CHAUD pour le delai : editer la valeur suffit, sans rebuild NI redemarrage.
# Le mettre a false n'aveugle PAS les pastilles d'etat de la tablette : seule la coupure
# automatique est supprimee.
robot.watchdog.enabled=true
robot.watchdog.silence.seconds=3.0

# Choix du fournisseur de reconnaissance/synthese vocale : GOOGLE (cloud) ou VOSK/PIPER (local).
# Editable sans rebuild : changer la valeur ici puis redemarrer le conteneur.
# Le robot tourne en LOCAL depuis le 2026-07-30 : pas de latence reseau, pas de quota, pas de
# facture. Remettre GOOGLE ne sert qu'a comparer la qualite de reconnaissance.
speech.recognizer.provider=VOSK
speech.synthesizer.provider=PIPER

# Speech synthesis with Google
speech.synthesis.google.language.code=fr-FR
speech.synthesis.google.voice.name=fr-FR-Wavenet-D
speech.synthesis.google.voice.filter=synthesis_from_wavenet_d.sh

# Speech recognition with Google
speech.recognizer.google.language.code=fr-FR

# Speech recognition with Vosk (local, PoC valide sur le Jetson le 2026-07-28).
# Modele a deployer manuellement sous ${ROBOT_HOME}/reconnaissanceVocale/vosk/<nom>
# (non versionne dans git, cf. modeles OpenCV du chantier vision).
speech.recognizer.vosk.model.name=vosk-model-small-fr-0.22

# Duree de silence (en secondes) marquant la fin d'une phrase. C'est le poste dominant du
# delai entre la fin de la parole et le texte reconnu.
# RECHARGE A CHAUD : editer cette valeur suffit, sans rebuild NI redemarrage du conteneur.
# La baisser rend le robot plus reactif, mais coupe la phrase sur une simple hesitation
# (le fragment deja detecte part a la reconnaissance et la suite est perdue, l'ecoute etant
# en pause pendant la reponse). 0.6 s s'etait revele trop court ; 1.2 s a suivi, puis 1.0 s
# depuis le passage a VOSK -- le decodage au fil de la parole rend la fin de phrase plus nette
# qu'avec Google, et ce dixieme se sent a l'usage.
speech.recognizer.silence.duration.seconds=1.0

# Speech synthesis with Piper (local, PoC valide sur le Jetson le 2026-07-29).
# Binaire + modele a deployer manuellement sous ${ROBOT_HOME}/synthese-vocale/piper/
# (piper-bin/ = binaire + libs + espeak-ng-data, models/ = voix .onnx+.onnx.json),
# non versionnes dans git.
speech.synthesis.piper.voice.model.name=fr_FR-siwis-medium.onnx
speech.synthesis.piper.voice.filter=synthesis_piper_walle.sh

################################################
# Configuration Phidgets (motors, servomotors)
################################################
phidgets.hub.serial.number=561050

# Differential driving
phidgets.differential.driving.motor.left.port=1
phidgets.differential.driving.motor.right.port=2
phidgets.differential.driving.motor.max.speed=1.0
phidgets.differential.driving.motor.acceleration=1

# Neck
# ATTENTION, les butees restent en POSITIONS MOTEUR (c'est la seule facon de les regler a la
# main), mais vitesses et accelerations sont en DEGRES DE TETE PAR SECONDE depuis le
# 2026-09-08, comme tout ce qui traverse Cou. Les rapports : panoramique 1,583 deg/unite
# (goBILDA 2000 en prise directe), inclinaison 4,97 (Stingray-2, mesure du 2026-09-06),
# monter/descendre 1 -- jamais mesure, et c'est une translation, la camera n'y pivote pas.
# Correspondance : pan 40 unites/s -> 63 deg/s, accel 200 -> 317 ; tilt 10 -> 50, 200 -> 994.
# Meme vitesse physique qu'avant, exprimee dans la bonne echelle.
phidgets.neck.motor.pan.index=0
phidgets.neck.motor.pan.position.init=95
phidgets.neck.motor.pan.position.min=35
phidgets.neck.motor.pan.position.max=155
phidgets.neck.motor.pan.speed=63
phidgets.neck.motor.pan.acceleration=317
phidgets.neck.motor.tilt.index=1
phidgets.neck.motor.tilt.position.init=67
# Butee haute de l'inclinaison, MESUREE sur le robot le 2026-09-08 : 53 degres de tete, soit
# la position moteur 67 - 53/4,97. Elle valait 60 (34,8 degres) et le regard demandait
# regulierement d'aller au-dela -- journal : "Servo 1 : consigne 56.4 bornee a 60.0". La course
# de l'inclinaison va donc maintenant de -39,8 a +53 degres.
phidgets.neck.motor.tilt.position.min=56.34
phidgets.neck.motor.tilt.position.max=75
phidgets.neck.motor.tilt.speed=50
phidgets.neck.motor.tilt.acceleration=994
phidgets.neck.motor.up_down.index=2
phidgets.neck.motor.up_down.position.init=140
phidgets.neck.motor.up_down.position.min=80
phidgets.neck.motor.up_down.position.max=150
phidgets.neck.motor.up_down.speed=100
phidgets.neck.motor.up_down.acceleration=200

# Eyes
# ATTENTION, ces valeurs sont en DEGRES D'OEIL depuis le 2026-09-03, plus en unites
# moteur. Le servo n'est pas sur l'axe de l'oeil : il est visse dans la coque et pousse
# une bielle ancree sur la platine fixe. Le rapport n'est donc pas constant -- 1,25 degre
# d'oeil par degre de servo au neutre, 3,70 en bout de course. La conversion vit dans
# TransmissionOeil, les cotes dans robot-core/3d/mesures/MESURES.md.
#
# SIGNE : positif = bord exterieur de la coque VERS LE HAUT, donc les deux coques se
# rapprochent. C'est le cote court : elles se touchent a +6,87 degres chacune. Le cote
# long, 35 degres, est le negatif -- l'air triste, que le robot n'a jamais su faire.
#
# Chaque oeil garde DEUX positions MOTEUR, a ne pas confondre :
#   .init  ou le servo est amene au demarrage. C'est une POLITIQUE, la posture de travail.
#   .zero  ou le dessus de la coque est de niveau. C'est une MESURE, et c'est l'origine de
#          tous les degres d'oeil ci-dessous -- butees, repos, et les animations avec.
# Les deux valent la meme chose aujourd'hui : le robot demarre les coques de niveau. Garder
# deux cles quand meme, parce qu'elles repondent a deux questions differentes -- vouloir un
# demarrage legerement baisse ne devrait pas obliger a toucher a l'etalonnage.
#
# TOUT CE BLOC A ETE REFAIT LE 2026-09-07. Ce qui etait faux, et qui l'etait depuis le
# 2026-09-04 :
#   - le SIGNE de la transmission etait inverse, donc les butees etaient posees du mauvais
#     cote du mecanisme. La butee haute tombait 14 degres AU-DELA du contact des coques :
#     les servos forcaient l'un contre l'autre a chaque animation.
#   - l'ECHELLE valait 1, alors qu'une unite de position Phidgets vaut 1,583 degre de servo
#     reel (RCC1000 : 550-2450 us sur 0-180, soit 10,56 us par unite ; goBilda 2000 double
#     mode : 300 degres sur 500-2500 us). Le controleur ne connait pas le servo qu'il pilote,
#     il ne fait que convertir en largeur d'impulsion. Meme facteur pour les axes du cou, qui
#     ne l'appliquent pas encore -- le curseur panoramique a 60 tourne la tete de 90 degres.
#   - le .zero valait la position de DEMARRAGE, choisie a l'oeil nu. Le .init vaut maintenant
#     10 degres sous le niveau : un regard legerement baisse au demarrage, demande le 2026-09-08.
# Les trois se compensaient a peu pres au voisinage du neutre, ce qui les a rendus
# invisibles, et divergeaient en bout de course.
#
# Mesure qui a tout debloque : amener les deux coques AU CONTACT. C'est le seul repere dur
# du mecanisme, il ne demande aucun instrument, et la geometrie donne +6,87 degres chacune.
# Le niveau a bulle pose sur la coque, lui, a donne trois lectures incompatibles -- ne pas
# recommencer avec.
#
# Correspondance ancienne commande -> nouvelle, pour relire les vieux reglages :
#   +31,06 (ancienne butee max) -> +25,3   soit 18 degres DANS le contact
#   +21,03 (image-cle animation) -> +15,3  idem
#   +14,00 (contact mesure)      ->  +6,87
#    +0,00 (ancien demarrage)    -> -14,73
#    -6,14 (ancienne butee min)  -> -26,7
#    -8,53 (ancien repos)        -> -38,6  au-dela du contact bas : c'est bien l'appui recherche
#
# Les butees dures, en degres d'oeil : contact des coques a +6,87 chacune en haut et -35,27
# en bas, point mort de la tringlerie a -41,94. Le point mort est ce qui arrete la descente en
# pratique -- c'est lui qu'on sent quand l'oeil refuse d'aller plus bas.
phidgets.eyes.motor.right.index=3
phidgets.eyes.motor.right.position.init=97.10
phidgets.eyes.motor.right.position.zero=101.94
phidgets.eyes.right.speed=79
phidgets.eyes.right.acceleration=119
phidgets.eyes.motor.left.index=4
phidgets.eyes.motor.left.position.init=95.90
phidgets.eyes.motor.left.position.zero=91.06
phidgets.eyes.left.speed=79
phidgets.eyes.left.acceleration=119
# Butees. Elles ne sont plus reglees a la main mais deduites de la mecanique, avec une marge :
# les coques se touchent quand la SOMME des deux angles atteint 13,74, donc plafonner chaque
# oeil a 5,5 garantit qu'elles ne se touchent jamais, meme yeux dissocies -- il reste alors
# 1,4 degre de marge, ce que l'essai du 2026-09-08 a confirme a l'oeil.
# En bas, -33 laisse 2,3 degres avant le contact des coques et 9 avant le point mort.
# Les vitesses passent de 50/75 a 79/119 : c'est la MEME vitesse physique qu'avant, exprimee
# dans la bonne echelle.
phidgets.eyes.position.min=-33
phidgets.eyes.position.max=5.5

# Positions de repos (arret du robot) : rejointes AVANT le desengagement des servos
# pour que la tete et les yeux ne tombent pas d'un coup. Optionnelles : sans ces cles,
# la position initiale/zero est utilisee. Pour trouver les bonnes valeurs : placer la
# tete comme souhaite a la manette, dire "au revoir", puis relever les
# "Positions au moment de l'arret" dans les logs. La position de repos peut depasser
# les butees min/max de mouvement de 5 degres au plus (appui mecanique stable).
phidgets.neck.motor.pan.position.rest=95
phidgets.neck.motor.tilt.position.rest=77
phidgets.neck.motor.up_down.position.rest=140
phidgets.eyes.position.rest=-38
################################################