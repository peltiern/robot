services:
  robot-core:
    # Image construite et poussée depuis le poste de développement (voir docs/install_jetson_nano_version_docker.md)
    image: peltiern/robot-wall-e:java-25
    user: "root"
    env_file:
      - ${HOME}/Robot/Programme/configuration/.env
    environment:
      # Accès natif (FFM) : input4j (manette) et OpenCV (vision) appellent des méthodes
      # restreintes ; autorisé globalement pour éviter les warnings au démarrage.
      - JAVA_TOOL_OPTIONS=--enable-native-access=ALL-UNNAMED
      # Sortie son (sox/play) : haut-parleur sur la clé USB C-Media, désignée par son nom
      # de carte ALSA (insensible à l'ordre d'énumération USB, contrairement au numéro)
      - AUDIODEV=plughw:CARD=Device
    privileged: true  # Permet au conteneur d’accéder aux périphériques matériels
    # L'arrêt propre (retour des servos en position + désengagement) peut dépasser les 10s
    # par défaut, après lesquelles docker enverrait SIGKILL sans fermer les canaux Phidget
    stop_grace_period: 30s
    volumes:
      - ${HOME}/Robot/Programme:/Robot/Programme
      - /dev:/dev
    ports:
      - "8080:8080"
