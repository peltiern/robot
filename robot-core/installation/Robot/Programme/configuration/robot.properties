# Devices to select (by their name or partial name)
device.webcam.name=Integrated_Webcam_HD
device.microphone.name=ArrayUAC10

# Vision (webcam + detection) : desactivee par defaut. Necessite une webcam et le
# serveur Python gRPC (localhost:50051). Sans rebuild : editer ici puis redemarrer
# le conteneur (le flag est lu au demarrage de l'organe).
robot.capteurs.vision.enabled=false

# Debit du flux video envoye a la webapp. C'est le debit de PRODUCTION qui doit tenir dans
# le lien : rien, en aval, ne freine la boucle de capture. Trop haut, les images s'empilent
# dans le tampon d'envoi de la session jusqu'a la limite et Spring ferme la connexion
# ("Buffer size ... exceeds the allowed limit"), d'ou une webapp qui laggue puis se coupe.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# Reperes en 640x480 : qualite 60 + 8 fps ~= 120 Ko/s ; qualite 95 + 10 fps ~= 1 Mo/s.
# La qualite s'applique aussi a l'image envoyee au serveur Python de detection.
robot.capteurs.vision.stream.fps=8
robot.capteurs.vision.stream.jpeg.quality=60

# Watchdog : coupe les moteurs (arret d'urgence) quand un organe du mouvement cesse de
# donner signe de vie ALORS QUE quelque chose bouge. Le cas a craindre : le robot roule et la
# manette meurt — les ordres de mouvement sont continus, plus personne n'enverra le STOPPER,
# et le bouton B est mort avec elle.
# Le delai est volontairement large devant les cadences reelles de battement (16 ms manette,
# 50 ms cou/yeux, 200 ms chenilles) : une pointe de charge sur le Nano ne doit jamais passer
# pour une panne, un watchdog qui se declenche a tort finit debranche.
# RECHARGE A CHAUD pour le delai : editer la valeur suffit, sans rebuild NI redemarrage.
# Le mettre a false n'aveugle PAS les pastilles d'etat de la tablette : seule la coupure
# automatique est supprimee.
robot.watchdog.enabled=true
robot.watchdog.silence.seconds=3.0

# Choix du fournisseur de reconnaissance/synthese vocale : GOOGLE (cloud) ou VOSK/PIPER (local).
# Editable sans rebuild : changer la valeur ici puis redemarrer le conteneur.
speech.recognizer.provider=GOOGLE
speech.synthesizer.provider=GOOGLE

# Speech synthesis with Google
speech.synthesis.google.language.code=fr-FR
speech.synthesis.google.voice.name=fr-FR-Wavenet-D
speech.synthesis.google.voice.filter=synthesis_from_wavenet_d.sh

# Speech recognition with Google
speech.recognizer.google.language.code=fr-FR

# Speech recognition with Vosk (local, PoC valide sur le Jetson le 2026-07-28).
# Modele a deployer manuellement sous ${ROBOT_HOME}/reconnaissanceVocale/vosk/<nom>
# (non versionne dans git, cf. modeles OpenCV du chantier vision).
speech.recognizer.vosk.model.name=vosk-model-small-fr-0.22

# Duree de silence (en secondes) marquant la fin d'une phrase. C'est le poste dominant du
# delai entre la fin de la parole et le texte reconnu.
# RECHARGE A CHAUD : editer cette valeur suffit, sans rebuild NI redemarrage du conteneur.
# La baisser rend le robot plus reactif, mais coupe la phrase sur une simple hesitation
# (le fragment deja detecte part a la reconnaissance et la suite est perdue, l'ecoute etant
# en pause pendant la reponse). 0.6 s s'etait revele trop court, d'ou ce 1.2 s.
speech.recognizer.silence.duration.seconds=1.2

# Speech synthesis with Piper (local, PoC valide sur le Jetson le 2026-07-29).
# Binaire + modele a deployer manuellement sous ${ROBOT_HOME}/synthese-vocale/piper/
# (piper-bin/ = binaire + libs + espeak-ng-data, models/ = voix .onnx+.onnx.json),
# non versionnes dans git.
speech.synthesis.piper.voice.model.name=fr_FR-siwis-medium.onnx
speech.synthesis.piper.voice.filter=synthesis_piper_passthrough.sh

################################################
# Configuration Phidgets (motors, servomotors)
################################################
phidgets.hub.serial.number=561050

# Differential driving
phidgets.differential.driving.motor.left.port=1
phidgets.differential.driving.motor.right.port=2
phidgets.differential.driving.motor.max.speed=1.0
phidgets.differential.driving.motor.acceleration=1

# Neck
phidgets.neck.motor.pan.index=0
phidgets.neck.motor.pan.position.init=95
phidgets.neck.motor.pan.position.min=35
phidgets.neck.motor.pan.position.max=155
phidgets.neck.motor.pan.speed=40
phidgets.neck.motor.pan.acceleration=200
phidgets.neck.motor.tilt.index=1
phidgets.neck.motor.tilt.position.init=67
phidgets.neck.motor.tilt.position.min=60
phidgets.neck.motor.tilt.position.max=75
phidgets.neck.motor.tilt.speed=10
phidgets.neck.motor.tilt.acceleration=200
phidgets.neck.motor.up_down.index=2
phidgets.neck.motor.up_down.position.init=140
phidgets.neck.motor.up_down.position.min=80
phidgets.neck.motor.up_down.position.max=150
phidgets.neck.motor.up_down.speed=100
phidgets.neck.motor.up_down.acceleration=200

# Eyes
phidgets.eyes.motor.right.index=3
phidgets.eyes.motor.right.position.zero=95
phidgets.eyes.motor.right.speed=40
phidgets.eyes.motor.right.acceleration=60
phidgets.eyes.motor.left.index=4
phidgets.eyes.motor.left.position.zero=98
phidgets.eyes.motor.left.speed=40
phidgets.eyes.motor.left.acceleration=60
phidgets.eyes.motor.relative.position.min=-5
phidgets.eyes.motor.relative.position.max=20

# Positions de repos (arret du robot) : rejointes AVANT le desengagement des servos
# pour que la tete et les yeux ne tombent pas d'un coup. Optionnelles : sans ces cles,
# la position initiale/zero est utilisee. Pour trouver les bonnes valeurs : placer la
# tete comme souhaite a la manette, dire "au revoir", puis relever les
# "Positions au moment de l'arret" dans les logs. La position de repos peut depasser
# les butees min/max de mouvement de 5 degres au plus (appui mecanique stable).
phidgets.neck.motor.pan.position.rest=95
phidgets.neck.motor.tilt.position.rest=77
phidgets.neck.motor.up_down.position.rest=140
phidgets.eyes.motor.relative.position.rest=-7
################################################