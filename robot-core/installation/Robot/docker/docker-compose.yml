version: '3'

services:
  robot-core:
    image: peltiern/robot-docker-java:java-21
    build:
      context: .
    user: "root"
    env_file:
      - ${HOME}/Robot/Programme/configuration/.env
    environment:
      - JAVA_TOOL_OPTIONS=-Dnet.java.games.input.librarypath=/Robot/Programme/jinput
    privileged: true  # Permet au conteneur d’accéder aux périphériques matériels
    volumes:
      - ${HOME}/Robot/Programme:/Robot/Programme
      - ${HOME}/Robot/Programme/jinput:/Robot/Programme/jinput
      - /dev:/dev
    ports:
      - "8080:8080"
