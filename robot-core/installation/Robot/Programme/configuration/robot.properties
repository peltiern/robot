# Devices to select (by their name or partial name)
device.webcam.name=Integrated_Webcam_HD
device.microphone.name=ArrayUAC10

# Vision (webcam + detection) : desactivee par defaut. Necessite une webcam et le
# serveur Python gRPC (localhost:50051). Sans rebuild : editer ici puis redemarrer
# le conteneur (le flag est lu au demarrage de l'organe).
robot.capteurs.vision.enabled=false

# Debit du flux video envoye a la webapp. C'est le debit de PRODUCTION qui doit tenir dans
# le lien : rien, en aval, ne freine la boucle de capture. Trop haut, les images s'empilent
# dans le tampon d'envoi de la session jusqu'a la limite et Spring ferme la connexion
# ("Buffer size ... exceeds the allowed limit"), d'ou une webapp qui laggue puis se coupe.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# Reperes en 640x480 : qualite 60 + 8 fps ~= 120 Ko/s ; qualite 95 + 10 fps ~= 1 Mo/s.
# La qualite s'applique aussi a l'image envoyee au serveur Python de detection.
robot.capteurs.vision.stream.fps=8
robot.capteurs.vision.stream.jpeg.quality=60

# Ce qu'un visage doit valoir pour qu'on en tire une empreinte -- meme porte pour la photo
# importee et pour la camera. Une empreinte baclee ne gene pas que la personne concernee : la
# reconnaissance retient la MEILLEURE similarite parmi toutes les empreintes connues, et une
# mauvaise empreinte peut depasser le seuil face a quelqu'un d'AUTRE.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# - nettete.minimale : variance du laplacien, visage ramene a 192 px. Reperes mesures sur les
#   photos d'exemple : nettes 222 a 3423, franchement floutees 3 a 52. Si un enrolement devant
#   la camera echoue toujours ("Je n'ai pas reussi a bien te regarder"), c'est le premier
#   nombre a baisser -- les logs DEBUG de l'organe vision donnent la valeur mesuree.
# - asymetrie.maximale : decalage du nez par rapport au milieu des yeux, en ecarts d'yeux.
#   Au-dela, le visage est tenu pour trop de profil : SFace est entraine de face, et l'empreinte
#   d'un profil tombe parfois plus pres de quelqu'un d'autre. Le robot rend alors "quelqu'un"
#   au lieu d'un nom -- ca ne le fait PAS mieux reconnaitre de profil, ca remplace une mauvaise
#   reponse par pas de reponse. Reperes : de face 0,01 a 0,10 (roulis compris) ; 0,35 vaut a
#   peu pres 45 degres de lacet. Le baisser rend le robot muet des qu'on ne le regarde pas.
robot.capteurs.vision.visage.nettete.minimale=100
robot.capteurs.vision.visage.asymetrie.maximale=0.35

# Presence des personnes : a partir de quand le robot considere que quelqu'un est la, qu'il
# est parti, et qu'une rencontre merite d'etre annoncee.
# La detection de visages CLIGNOTE : mesure sur le robot, un visage immobile disparait et
# reapparait par trous de 100 a 250 ms, une seule frame ratee par le detecteur suffisant.
# Sans ces garde-fous, le robot demanderait son prenom a la meme personne six fois par quart
# de minute, et finirait debranche.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# - confirmation : duree de presence continue avant de croire que quelqu'un est la. Plus bas,
#   le robot aborde plus vite, mais reagit a qui ne fait que passer devant la camera.
#   C'est aussi le delai laisse a SFace pour reconnaitre quelqu'un avant qu'il soit declare
#   inconnu -- et SFace met couramment 1 s, bien plus de profil ou en bord de champ. Ne PAS
#   monter ce seuil pour couvrir ces cas : essaye le 2026-08-15 (a 4.0), ca ralentit l'abord
#   d'un vrai inconnu sans jamais rendre la certitude. C'est PresentationActivity qui traite
#   l'erreur, en s'excusant si la personne est reconnue pendant qu'on lui demande son prenom.
# - absence : duree sans voir quelqu'un avant de le croire parti. C'est ce delai qui absorbe
#   le clignotement ; le descendre sous 1 s reveille le probleme.
# - fenetre : duree glissante sur laquelle un inconnu et les personnes connues sont departages
#   au nombre de fois qu'ils ont ete vus. Un meme visage sort tantot reconnu, tantot inconnu :
#   vu 3 fois comme Nicolas et 2 fois comme un inconnu, c'est Nicolas, et rien n'est demande.
#   L'arbitrage ne joue que dans ce sens : une erreur d'inconnu coute une question a quelqu'un
#   qu'on connait, une erreur de connu ne coute rien.
# - continuite : trou maximal tolere TANT QUE la venue n'est pas confirmee. Au dela, le
#   decompte repart de zero. C'est ce qui garantit plusieurs visages vus A LA SUITE avant de
#   decider, inconnu comme connu : sans lui, la tolerance de 4 s ci-dessus s'appliquait aussi
#   a la confirmation, et des perceptions eparses cumulaient la duree exigee comme si elles
#   avaient ete continues.
# - temporisation : delai minimal entre deux rencontres annoncees pour la MEME personne, meme
#   si elle est vraiment sortie du champ et revenue. Descendu de 120 a 30 s le 2026-08-15 :
#   a 120 s, quelqu'un qui s'absentait une minute revenait sans que le robot ne dise rien.
#   C'est desormais sans danger, une absence courte donnant une reprise et non un bonjour
#   (voir robot.retrouvailles.reprise.seconds plus bas). Ne pas trop descendre non plus :
#   quelqu'un qui bouge devant la camera se ferait relancer sans arret.
robot.presence.confirmation.seconds=1.5
robot.presence.absence.seconds=4.0
robot.presence.continuite.seconds=1.0
robot.presence.fenetre.seconds=3.0
robot.presence.rencontre.temporisation.seconds=30.0

# Retrouvailles : ce que le robot dit a quelqu'un de connu qui reapparait devant lui.
# TROIS reactions selon la duree de l'ABSENCE REELLE (le temps pendant lequel la personne n'a
# pas ete vue, et non le temps ecoule depuis la derniere rencontre annoncee -- avoir confondu
# les deux a fait dire au robot << on parlait de la population francaise >> douze secondes
# apres en avoir parle) :
# - sous silence.seconds : il ne dit RIEN. La personne s'est tournee ou est sortie du champ un
#   instant, la conversation n'a jamais ete interrompue, et la reprendre reviendrait a la couper.
# - sous reprise.seconds : il REPREND le fil sans saluer. Quelqu'un qui s'est absente une minute
#   et se fait dire bonjour a l'impression d'avoir ete oublie.
# - au dela : il SALUE, l'absence se remarque.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
robot.retrouvailles.silence.seconds=60.0
robot.retrouvailles.reprise.seconds=300.0

# Activites : delai minimal avant qu'une activite qui vient de se terminer puisse etre
# reclamee a nouveau. A ne pas confondre avec la temporisation ci-dessus, qui compte par
# personne : celle-ci protege de toute demande insistante, d'ou qu'elle vienne.
# Le cas traite est celui d'une activite qui tourne court (quelqu'un qu'on aborde et qui ne
# repond pas) : la cause est toujours la quand elle se termine, et sans delai elle repartirait
# aussitot, en boucle.
# Depuis le 2026-08-15, une demande refusee n'est plus perdue : elle est rejouee des que ce
# delai est ecoule, tant que la personne est la. Il n'a donc plus a etre court par prudence,
# mais 10 s suffisent -- 30 s se voyaient a l'usage, le robot restant muet devant quelqu'un.
# RECHARGE A CHAUD : editer cette valeur suffit, sans rebuild NI redemarrage du conteneur.
robot.activite.temporisation.seconds=10.0

# Regard : le robot tourne la tete vers le visage qu'il percoit (panoramique et inclinaison,
# en boucle ouverte, un coup a la fois). La camera etant portee par la tete, le visage se
# retrouve recentre et la correction suivante n'a plus lieu d'etre.
# RECHARGE A CHAUD : editer ces valeurs suffit, sans rebuild NI redemarrage du conteneur.
# - sens.inverse : ETALONNAGE A FAIRE UNE FOIS PAR AXE. Le sens depend du montage du servo,
#   indevinable depuis le code, et les deux axes sont independants. Si le robot DETOURNE la
#   tete au lieu de regarder, passer l'axe concerne a true.
#   Le panoramique a ete verifie sur le robot le 2026-08-12 : false est le bon sens.
# - camera.champ.horizontal.degres : champ de vision de la webcam. Une valeur fausse ne fait
#   pas regarder a cote, elle fait sous-corriger ou depasser. A mesurer plutot qu'a croire.
#   Sert aux DEUX axes : les pixels etant carres, l'echelle est la meme en hauteur.
# - zone.morte : en deca, le robot considere qu'il regarde deja la personne. Sans elle, la
#   boite englobante qui respire d'une image a l'autre suffirait a agiter la tete.
#   C'est aussi elle qui absorbe ce qui reste d'imprecision apres le mouvement.
#   Attention en la baissant : la consigne correspondante doit rester au-dessus de 1 unite,
#   sinon l'axe ne corrige plus rien (le code refuse ces consignes-la, sans quoi il les
#   repeterait sans fin).
# - commande.par.degre.vu : ETALONNAGE MATERIEL, et SEUL reglage entre l'ecart vu et la
#   consigne. Combien d'unites de commande du cou valent un degre d'ecart vu par la camera.
#   UNE VALEUR PAR AXE : les deux servos n'entrainent pas la tete avec le meme bras de levier.
#   Le cou se commande en ABSOLU (il lit ou il est et ajoute l'angle) : la cible est donc
#   calculee directement, l'ecart est corrige EN ENTIER, et il n'y a pas d'amortissement.
#   Un amortissement a 70 %, essaye le 2026-08-12, n'a fait qu'etaler le meme mouvement en
#   quatre petits a-coups.
#   Mieux vaut sous-corriger (un mouvement de plus) que sur-corriger (oscillation sans fin).
#   MESURE FIABLE, faite le 2026-08-15 SUR L'OSCILLATION ELLE-MEME, ce qui evite le piege des
#   mesures precedentes (relever un ecart avant que la tete soit stabilisee sous-estime le
#   deplacement, et c'est ce qui avait fait retenir 1.0 et 0.3) : quand la tete fait
#   l'aller-retour, chaque correction se lit entierement sur l'ecart suivant.
#   Panoramique : commande -5.0 -> l'ecart passe de -5.0 a +5.7, soit 10.7 degres pour
#   5 unites. Inclinaison : commande +2.1 -> l'ecart passe de +7.0 a -7.5, soit 14.5 degres
#   pour 2.1 unites. Une unite vaut donc ~2.1 degres de regard en panoramique et ~6.9 en
#   inclinaison, soit un gain de boucle de 2.1 sur LES DEUX axes avec les anciennes valeurs :
#   la tete corrigeait le double de l'ecart et repassait de l'autre cote a l'identique.
#   Les valeurs ci-dessous visent un gain de 0.9 : convergence en un coup, sans depassement.
#   ATTENTION, l'amplitude de cette oscillation est fixee par la zone morte, pas par elle :
#   avec un gain de 2, elargir la zone morte AGRANDIT les mouvements au lieu de les calmer.
#   Trop haut : la tete depasse et l'ecart change de signe a chaque coup. Trop bas : elle
#   arrive par une suite de petits a-coups.
# - temporisation : delai entre deux corrections, le temps que le servo arrive. Il ne sert qu'a
#   ca : trop long, il ne stabilise rien de plus, il hache seulement le suivi d'un visage qui
#   se deplace, rattrape par sauts espaces. A regler sur le temps de trajet reel, pas plus :
#   le pan tourne a 40 unites/s (phidgets.neck.motor.pan.speed), une correction courante de
#   5 unites lui prend donc 125 ms, et le tilt a 10 unites/s en prend 130 pour 1.3 unite.
#   0.5 s laisse largement la marge et divise par deux l'amplitude de chaque a-coup.
# - priorite.manette : celui qui conduit gagne. Tout ordre de cou venu de la manette fait taire
#   le suivi de visage pendant ce delai, compte a partir du DERNIER ordre -- donc a partir du
#   relachement du joystick, qui envoie un STOPPER. Le suivi reprend seul, il n'y a pas
#   d'interrupteur a rallumer. Sans ca les deux se disputaient le meme servo : le regard corrige
#   deux fois par seconde, la manette envoie des ordres continus, et rien ne disait qui gagne.
#   Trop court, le regard reprend la tete entre deux coups de joystick ; trop long, le robot
#   parait absent apres qu'on a lache la manette.
robot.regard.enabled=true
robot.regard.panoramique.sens.inverse=false
robot.regard.inclinaison.sens.inverse=false
robot.regard.camera.champ.horizontal.degres=60.0
robot.regard.zone.morte.degres=5.0
robot.regard.panoramique.commande.par.degre.vu=0.45
robot.regard.inclinaison.commande.par.degre.vu=0.13
robot.regard.temporisation.seconds=0.5
robot.regard.priorite.manette.seconds=3.0

# Watchdog : coupe les moteurs (arret d'urgence) quand un organe du mouvement cesse de
# donner signe de vie ALORS QUE quelque chose bouge. Le cas a craindre : le robot roule et la
# manette meurt — les ordres de mouvement sont continus, plus personne n'enverra le STOPPER,
# et le bouton B est mort avec elle.
# Le delai est volontairement large devant les cadences reelles de battement (16 ms manette,
# 50 ms cou/yeux, 200 ms chenilles) : une pointe de charge sur le Nano ne doit jamais passer
# pour une panne, un watchdog qui se declenche a tort finit debranche.
# RECHARGE A CHAUD pour le delai : editer la valeur suffit, sans rebuild NI redemarrage.
# Le mettre a false n'aveugle PAS les pastilles d'etat de la tablette : seule la coupure
# automatique est supprimee.
robot.watchdog.enabled=true
robot.watchdog.silence.seconds=3.0

# Choix du fournisseur de reconnaissance/synthese vocale : GOOGLE (cloud) ou VOSK/PIPER (local).
# Editable sans rebuild : changer la valeur ici puis redemarrer le conteneur.
speech.recognizer.provider=GOOGLE
speech.synthesizer.provider=GOOGLE

# Speech synthesis with Google
speech.synthesis.google.language.code=fr-FR
speech.synthesis.google.voice.name=fr-FR-Wavenet-D
speech.synthesis.google.voice.filter=synthesis_from_wavenet_d.sh

# Speech recognition with Google
speech.recognizer.google.language.code=fr-FR

# Speech recognition with Vosk (local, PoC valide sur le Jetson le 2026-07-28).
# Modele a deployer manuellement sous ${ROBOT_HOME}/reconnaissanceVocale/vosk/<nom>
# (non versionne dans git, cf. modeles OpenCV du chantier vision).
speech.recognizer.vosk.model.name=vosk-model-small-fr-0.22

# Duree de silence (en secondes) marquant la fin d'une phrase. C'est le poste dominant du
# delai entre la fin de la parole et le texte reconnu.
# RECHARGE A CHAUD : editer cette valeur suffit, sans rebuild NI redemarrage du conteneur.
# La baisser rend le robot plus reactif, mais coupe la phrase sur une simple hesitation
# (le fragment deja detecte part a la reconnaissance et la suite est perdue, l'ecoute etant
# en pause pendant la reponse). 0.6 s s'etait revele trop court, d'ou ce 1.2 s.
speech.recognizer.silence.duration.seconds=1.2

# Speech synthesis with Piper (local, PoC valide sur le Jetson le 2026-07-29).
# Binaire + modele a deployer manuellement sous ${ROBOT_HOME}/synthese-vocale/piper/
# (piper-bin/ = binaire + libs + espeak-ng-data, models/ = voix .onnx+.onnx.json),
# non versionnes dans git.
speech.synthesis.piper.voice.model.name=fr_FR-siwis-medium.onnx
speech.synthesis.piper.voice.filter=synthesis_piper_walle.sh

################################################
# Configuration Phidgets (motors, servomotors)
################################################
phidgets.hub.serial.number=561050

# Differential driving
phidgets.differential.driving.motor.left.port=1
phidgets.differential.driving.motor.right.port=2
phidgets.differential.driving.motor.max.speed=1.0
phidgets.differential.driving.motor.acceleration=1

# Neck
phidgets.neck.motor.pan.index=0
phidgets.neck.motor.pan.position.init=95
phidgets.neck.motor.pan.position.min=35
phidgets.neck.motor.pan.position.max=155
phidgets.neck.motor.pan.speed=40
phidgets.neck.motor.pan.acceleration=200
phidgets.neck.motor.tilt.index=1
phidgets.neck.motor.tilt.position.init=67
phidgets.neck.motor.tilt.position.min=60
phidgets.neck.motor.tilt.position.max=75
phidgets.neck.motor.tilt.speed=10
phidgets.neck.motor.tilt.acceleration=200
phidgets.neck.motor.up_down.index=2
phidgets.neck.motor.up_down.position.init=140
phidgets.neck.motor.up_down.position.min=80
phidgets.neck.motor.up_down.position.max=150
phidgets.neck.motor.up_down.speed=100
phidgets.neck.motor.up_down.acceleration=200

# Eyes
phidgets.eyes.motor.right.index=3
phidgets.eyes.motor.right.position.zero=95
phidgets.eyes.motor.right.speed=40
phidgets.eyes.motor.right.acceleration=60
phidgets.eyes.motor.left.index=4
phidgets.eyes.motor.left.position.zero=98
phidgets.eyes.motor.left.speed=40
phidgets.eyes.motor.left.acceleration=60
phidgets.eyes.motor.relative.position.min=-5
phidgets.eyes.motor.relative.position.max=20

# Positions de repos (arret du robot) : rejointes AVANT le desengagement des servos
# pour que la tete et les yeux ne tombent pas d'un coup. Optionnelles : sans ces cles,
# la position initiale/zero est utilisee. Pour trouver les bonnes valeurs : placer la
# tete comme souhaite a la manette, dire "au revoir", puis relever les
# "Positions au moment de l'arret" dans les logs. La position de repos peut depasser
# les butees min/max de mouvement de 5 degres au plus (appui mecanique stable).
phidgets.neck.motor.pan.position.rest=95
phidgets.neck.motor.tilt.position.rest=77
phidgets.neck.motor.up_down.position.rest=140
phidgets.eyes.motor.relative.position.rest=-7
################################################