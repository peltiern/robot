# Niveaux de log : voir logback.xml (racine INFO, fr.roboteek INFO).
spring.output.ansi.enabled=always

# Ordonnanceur des tâches @Scheduled. Par défaut Spring n'en donne qu'UN SEUL thread, que se
# partageraient la télémétrie du cou, celle des yeux (50 ms chacune) et la sonde des chenilles :
# une tâche qui bloque sur un canal Phidget arrêterait les autres, et leurs battements
# s'éteindraient tous ensemble sans qu'aucun organe ne soit réellement mort. Le watchdog,
# lui, tourne sur son propre thread — un surveillant ne partage pas son fil d'exécution avec ce
# qu'il surveille.
spring.task.scheduling.pool.size=3

# IA conversationnelle : Claude via l'API Anthropic (clé dans le .env, jamais versionnée).
# Valeur par défaut vide pour ne pas empêcher le démarrage du robot si la clé est absente.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
